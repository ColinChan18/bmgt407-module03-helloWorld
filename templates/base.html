<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block page_title %}{% endblock %} | Colin Chan's Flask App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  </head>
  <body class="d-flex flex-column min-vh-100 bg-body-tertiary">
    <div class="flex-grow-1">
      <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container">
          <a class="navbar-brand" href="{{ url_for('favorite_course') }}">Colin Chan's Flask App</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav" aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="main-nav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link{% if request.endpoint == 'favorite_course' %} active{% endif %}" href="{{ url_for('favorite_course', subject='BMGT', course_number='407') }}">Favorite Course</a>
              </li>
              <li class="nav-item">
                <a class="nav-link{% if request.endpoint == 'contact' %} active{% endif %}" href="{{ url_for('contact') }}">Contact</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>

      <main class="container py-5">
        <div class="row justify-content-center">
          <div class="col-lg-8">
            <div class="card shadow-sm">
              <div class="card-body p-4 p-md-5">
                <h1 class="h2 mb-4">{% block page_head %}{% endblock %}</h1>
                {% block page_content %}{% endblock %}
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <footer class="flex-shrink-0 py-3 bg-dark text-white">
      <div class="container text-center">
        <p class="mb-0">Created by Colin Chan &middot; BMGT407 at the <a class="link-light" href="https://rhsmith.umd.edu/" target="_blank">Robert H. Smith School of Business</a></p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  </body>
</html>
